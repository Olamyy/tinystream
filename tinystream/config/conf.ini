[default]
mode = broker

[serialization]
type = messagepack

[broker]
partition_log_path = ./data/tinystream/log_partitions
partition_type = singlelogpartition
log_storage_type = filelogstorage
host = localhost
port = 9094
prefix_size = 8
byte_order = little

[controller]
host = localhost
port = 9093
heartbeat_timeout = 10
prefix_size = 8
byte_order = little

[metastore]
db_path = ./data/metastore/tinystream.meta.db
